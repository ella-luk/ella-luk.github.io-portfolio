.projects-grid {

  gap: 30px;
  padding: 100px 100px;
  padding-top: 30px;
}

.project {
  position: relative;
  overflow: hidden;
  border-radius: 10%;
}

.project img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10%;
  transition: transform 0.3s ease;
}

.project:hover img {
  transform: scale(1.05);
}

.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0, 0, 0, 0.6);
  color: #fff;
  opacity: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 0.3s ease;
  font-size: 2.5em;
  font-family: 'Times New Roman', Times, serif;
  text-align: center;
  border-radius: 10%;
}

.project:hover .overlay {
  opacity: 1;
  border-radius: 10%;
}

footer {
  padding: 20px;
  text-align: center;
}
